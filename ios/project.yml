name: ArtMem
options:
  bundleIdPrefix: dev.graffunder.artmem
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  ArtMemCore:
    path: ArtMemCore
targets:
  ArtMem:
    type: application
    platform: iOS
    sources: [ArtMem]
    dependencies:
      - package: ArtMemCore
    info:
      path: ArtMem/Info.plist
      properties:
        CFBundleDisplayName: ArtificialMemory
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - processing
          - fetch
        NSMicrophoneUsageDescription: >-
          ArtificialMemory listens continuously so it can transcribe, remember, and
          surface your conversations. Audio never leaves your devices.
        ITSAppUsesNonExemptEncryption: false
        # The companion server is plain-HTTP on the home LAN / Tailscale by
        # design (single-user, private network). Without this, ATS blocks
        # every request on a real device and the app looks broken.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.graffunder.artmem
        # CI overrides both with a rolling version (see ios-ipa.yml); these
        # keep local/xcodegen builds resolving $(...) placeholders.
        # (key-decoder parity)
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
