name: ArtMem
options:
  bundleIdPrefix: dev.graffunder.artmem
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  ArtMemCore:
    path: ArtMemCore
targets:
  ArtMem:
    type: application
    platform: iOS
    sources: [ArtMem]
    dependencies:
      - package: ArtMemCore
    info:
      path: ArtMem/Info.plist
      properties:
        CFBundleDisplayName: ArtificialMemory
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - processing
          - fetch
        NSMicrophoneUsageDescription: >-
          ArtificialMemory listens continuously so it can transcribe, remember, and
          surface your conversations. Audio never leaves your devices.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.graffunder.artmem
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
