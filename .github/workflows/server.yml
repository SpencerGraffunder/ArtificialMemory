name: Server Tests

# Same self-hosted Mac runner. pytest is ~15 s and the eval replay ~20 s, so
# running these on every server push costs nothing and keeps main honest.

on:
  push:
    paths: ["server/**", "eval/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "eval/**"]
  workflow_dispatch:

jobs:
  pytest-eval:
    runs-on: [self-hosted, macOS, ARM64, ambient]
    steps:
      - uses: actions/checkout@v4

      # No setup-python: its shared toolcache wants /Users/runner (unwritable).
      # This Mac already has Homebrew CPython 3.12 on the runner PATH.
      - name: Install
        working-directory: server
        run: |
          /opt/homebrew/bin/python3.12 -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"

      - name: Unit + integration tests
        working-directory: server
        run: .venv/bin/python -m pytest tests/ -q

      - name: Eval replay (precision/recall + cards/hour budget)
        run: server/.venv/bin/python eval/replay/run.py

      - name: Regenerate scoring parity fixtures (consumed by Swift CI)
        run: |
          server/.venv/bin/python eval/export_scoring_fixtures.py
          git diff --exit-code ios/AmbientCore/Tests/AmbientCoreTests/Fixtures/scoring_parity.json \
            || { echo "::error::server scoring changed — regenerate + commit the parity fixtures"; exit 1; }
