# iOS DEVICE .ipa pipeline — mirrors pianobar-ios / key-decoder.
# (The sibling ios-build.yml builds a SIMULATOR zip for local dev; this one
# produces the sideloadable unsigned device .ipa and publishes it like the
# other apps: rolling 'ios-latest' GitHub Release + hub-site download link +
# iCloud Drive/IPAs mirror on Spec's Mac runner. The .ipa carries a build-time
# version (yy.m.d + run number, key-decoder scheme) in its bundle, its asset
# name (ArtificialMemory-<yy.m.d>-<run>.ipa) and the release title.)
#
# Runs on Spec's Mac (runner mac-artmem). Kept test-free on purpose: ArtMemCore
# tests and the simulator gate live in ios-build.yml, so an ios/** push here
# costs one compile + assemble, not a second full test cycle on a laptop.
name: iOS Device IPA

# GITHUB_TOKEN defaults to read-only here; publishing releases needs write.
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  device-ipa:
    name: Build device .ipa + publish
    runs-on: [self-hosted, macOS, ARM64, artmem]
    env:
      # LaunchAgent runners lack the interactive PATH (Homebrew + Xcode tools).
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Rolling version (date + run number)
        run: |
          # Same scheme as key-decoder: yy.m.d + CI run number, and THE SAME
          # version stamps the bundle (MARKETING_VERSION/CURRENT_PROJECT_VERSION),
          # the .ipa asset name, and the release title — what you install is
          # what you see. v* tag pushes carry the tag version instead.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(date -u +%y.%-m.%-d)" >> "$GITHUB_ENV"
          fi
          echo "APP_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Release for iOS device
        run: |
          xcodebuild -project ios/ArtMem.xcodeproj -scheme ArtMem \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-device \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Assemble .ipa (asset named with the version)
        run: |
          # One version-stamp mechanism only: the bundle already carries
          # $APP_VERSION ($APP_BUILD) from the build settings above — never
          # also PlistBuddy-patch the staged Payload (whichever runs last
          # silently wins). The .ipa is named with that same version so the
          # filename, the release, and what LiveContainer shows all agree.
          ASSET="ArtificialMemory-${APP_VERSION}-${APP_BUILD}.ipa"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          APP=$(find dd-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Bundling $APP"
          mkdir -p ipa-staging/Payload
          cp -R "$APP" ipa-staging/Payload/
          cd ipa-staging
          zip -qry ../"$ASSET" Payload
          cd ..
          ls -lh "$ASSET"

      - name: Upload .ipa as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Publish .ipa as GitHub Release (bare file, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ios-latest
          if [ "$GITHUB_REF_NAME" != "main" ] && [ -n "$GITHUB_REF_NAME" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          # Re-create, never --clobber: a clobbered release freezes its
          # published date (the hub card would show the first-ever build date
          # forever). Delete keeps the tag; the fresh release points at this
          # exact commit. Runner jobs serialize, so pushes can't race here.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "ArtificialMemory ${APP_VERSION} (${APP_BUILD})" \
            --notes "Build ${APP_BUILD} of ${APP_VERSION}. Version visible in LiveContainer = CFBundleShortVersionString ${APP_VERSION} (${APP_BUILD}). Unsigned .ipa — re-sign with Sideloadly / AltStore / an ad-hoc profile to install. The app reaches your self-hosted server over plain HTTP on your LAN/Tailscale — set the endpoint in Settings."
          gh release view "$TAG"

      - name: Mirror .ipa to iCloud Drive
        continue-on-error: true
        run: |
          # This runner IS Spec's Mac, so a local copy into iCloud Drive IS
          # the upload (bird syncs it; no cron, no tokens). continue-on-error:
          # a sync hiccup must never redden a build.
          DEST="$HOME/Library/Mobile Documents/com~apple~CloudDocs/IPAs"
          mkdir -p "$DEST"
          cp -f "$ASSET" "$DEST/$ASSET"
          ls -lh "$DEST"
